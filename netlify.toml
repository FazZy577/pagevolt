[[headers]]
  for = "/branch-deploy/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/.netlify/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200